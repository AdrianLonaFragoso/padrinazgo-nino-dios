<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8" />
<title>OG image — Padrinazgo del Niño Dios</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @page { size: 1200px 630px; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #f7f2e8;
    background:
      radial-gradient(circle at 10% 14%, rgba(179,148,105,.22), transparent 42%),
      radial-gradient(circle at 92% 88%, rgba(123,151,142,.18), transparent 46%),
      #172632;
  }
  .frame {
    position: relative;
    width: 1200px; height: 630px;
    padding: 64px 78px;
    display: grid;
    grid-template-columns: minmax(0, 1.08fr) minmax(0, .92fr);
    align-items: center;
    gap: 40px;
  }
  .frame::after {
    content: '';
    position: absolute;
    inset: 22px;
    border: 1px solid rgba(212,180,128,.28);
    pointer-events: none;
  }
  .corner::before, .corner::after {
    content: '';
    position: absolute;
    width: 66px; height: 66px;
    border-color: rgba(196,162,112,.6);
  }
  .corner::before { top: 22px; left: 22px; border-top: 2px solid; border-left: 2px solid; }
  .corner::after { right: 22px; bottom: 22px; border-right: 2px solid; border-bottom: 2px solid; }

  .copy { position: relative; z-index: 1; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 14px;
    color: #d8b878; text-transform: uppercase;
    letter-spacing: .24em; font-size: 16px; font-weight: 700;
  }
  .eyebrow::before { content: ''; width: 34px; height: 2px; background: #c4a270; }
  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 400;
    font-size: 74px;
    line-height: 1.06;
    letter-spacing: -.03em;
    margin-top: 26px;
    color: #f9f4ea;
  }
  h1 span { color: #d3b079; font-style: italic; }
  .stroke { width: 84px; height: 3px; background: #aa834f; margin: 30px 0 26px; }
  .lead { max-width: 520px; color: #c7cfce; font-size: 23px; line-height: 1.55; }
  .parish {
    display: flex; align-items: center; gap: 14px;
    margin-top: 34px; padding-top: 22px;
    border-top: 1px solid rgba(255,255,255,.16);
    color: #e3dccd; font-size: 18px; letter-spacing: .04em;
  }
  .parish svg { width: 24px; height: 24px; color: #c4a270; }

  .art { display: flex; align-items: center; justify-content: center; }
  .nativity { height: 500px; width: auto; filter: drop-shadow(0 22px 30px rgba(0,0,0,.35)); }
</style>
</head>
<body>
  <div class="frame corner">
    <div class="copy">
      <div class="eyebrow">Navidad 2026</div>
      <h1>Propuesta de<br><span>Padrinazgo</span><br>del Niño Dios</h1>

      <div class="parish">
